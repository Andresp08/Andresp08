name: Live weather widget

on:
  schedule:
    # Cada 6 horas → 4 commits al día (en vez de 24)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update the weather block in README.md
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          # San Gil, Santander, Colombia. Coordenadas en vez de nombre de ciudad:
          # es lo que recomienda OpenWeatherMap y evita ambigüedades.
          WEATHER_LAT: "6.5547"
          WEATHER_LON: "-73.1330"
          WEATHER_LABEL: "San Gil"
          WEATHER_TZ: "America/Bogota"
        run: python scripts/weather.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update weather"
          git push
