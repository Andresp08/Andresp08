name: 3D contribution calendar

on:
  schedule:
    # 03:15 UTC diario (~22:15 en Colombia del día anterior)
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Add private-repo contributions too? Use a PAT with `repo` scope
          # as secret GH_PAT and set GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Commit the SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: refresh 3D contribution calendar"
          git push
