name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Dos jobs = dos SVG commiteados en el repo = dos commits al día.
# La ventaja sobre github-readme-stats: estos archivos viven en TU repositorio,
# así que los sirve GitHub. No dependen de que la instancia gratis de nadie
# esté arriba ni dentro de su cuota de Vercel.
jobs:
  # ── Panel principal: stats, actividad, lenguajes y logros ──────────────
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: andresp08
          filename: metrics.svg
          config_timezone: America/Bogota
          base: "header, activity, community, repositories"

          # Reemplaza el "Most Used Languages" de github-readme-stats
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          # Reemplaza los trofeos
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes

  # ── Calendario isométrico + hábitos de código ─────────────────────────
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: andresp08
          filename: metrics.calendar.svg
          config_timezone: America/Bogota
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
